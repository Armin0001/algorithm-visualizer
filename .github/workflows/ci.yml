name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    name: Build, test and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build (warnings are errors)
        run: dotnet build --no-restore --configuration Release

      - name: Test with coverage
        run: >-
          dotnet test --no-build --configuration Release
          --coverage --coverage-output-format cobertura --coverage-output coverage.cobertura.xml

      - name: Coverage summary
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool
          reportgenerator -reports:"**/TestResults/coverage.cobertura.xml" -targetdir:coverage -reporttypes:"MarkdownSummaryGithub;Html"
          cat coverage/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage

      # Publishing on every run (pull requests too) catches trimming and packaging problems before merge.
      - name: Publish the Blazor app
        run: dotnet publish src/AlgorithmVisualizer.Web --configuration Release --output publish

      - name: Prepare the site for GitHub Pages
        run: |
          site=publish/wwwroot
          # A project site is served from /<repo>/, so the app's base path has to match it.
          sed -i 's|<base href="/" />|<base href="/${{ github.event.repository.name }}/" />|' "$site/index.html"
          # Pages answers unknown paths with 404.html. Making that the app lets deep links such as /search load.
          cp "$site/index.html" "$site/404.html"
          touch "$site/.nojekyll"
          # Pages compresses responses itself, so the pre-compressed copies are dead weight.
          find "$site" \( -name '*.br' -o -name '*.gz' \) -delete

      - uses: actions/upload-pages-artifact@v5
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: publish/wwwroot

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
